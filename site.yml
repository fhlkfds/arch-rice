- name: Configure local Arch Linux workstation
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  vars:
    target_user: liam
    target_home: "/home/liam"
    smb_source: "//10.2.1.177/share"
    smb_mountpoint: /share
    smb_username: liam
    smb_password: Mailmail@504
    smb_credentials_file: /etc/samba/share-credentials
    yay_config_file: "/home/liam/.config/yay/config.json"
    yay_binary_path: /usr/bin/yay
    doas_conf: |
      permit persist liam as root
    brave_extensions_policy: |
      {

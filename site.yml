          },
          "ddkjiahejlhfcafbddmgiahcphecmpfh": {
            "installation_mode": "force_installed",
            "update_url": "https://clients2.google.com/service/update2/crx"
          }
        }
      }
    pacman_requested_packages: >-
      {{
        lookup('file', playbook_dir ~ '/pacman.txt').splitlines()
        | map('trim')
        | reject('equalto', '')
        | reject('match', '^#')
        | unique
        | list
      }}
    yay_requested_packages: >-
      {{
        lookup('file', playbook_dir ~ '/yay.txt').splitlines()
        | map('trim')
        | reject('equalto', '')
        | reject('match', '^#')
        | unique
        | list
      }}

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

  tasks:
    - name: Get target user UID
      ansible.builtin.command: "id -u {{ target_user }}"
      register: target_uid_cmd
      changed_when: false

    - name: Get target user GID
      ansible.builtin.command: "id -g {{ target_user }}"
      register: target_gid_cmd
      changed_when: false

    - name: Set target user numeric IDs
      ansible.builtin.set_fact:
        target_uid: "{{ target_uid_cmd.stdout | trim }}"
        target_gid: "{{ target_gid_cmd.stdout | trim }}"

    - name: Fully update Arch Linux
      ansible.builtin.command:
        argv:
          - pacman
          - -Syu
          - --noconfirm
      register: pacman_upgrade
      changed_when: >-
        'there is nothing to do' not in
        (((pacman_upgrade.stdout | default('')) ~ ' ' ~ (pacman_upgrade.stderr | default(''))) | lower)

    - name: Install base prerequisites
      ansible.builtin.package:
        name:
          - base-devel
          - cifs-utils
          - git
          - go
          - opendoas
          - rsync
        state: present

    - name: Check whether yay is already installed
      ansible.builtin.stat:
        path: "{{ yay_binary_path }}"
      register: yay_binary

    - name: Bootstrap yay from AUR when missing
      when: not yay_binary.stat.exists
      block:
        - name: Clone yay AUR repository
          ansible.builtin.git:
            repo: https://aur.archlinux.org/yay.git
            dest: "{{ yay_build_dir }}"
            depth: 1
            update: false

        - name: Ensure yay build directory is owned by target user
          ansible.builtin.file:
            path: "{{ yay_build_dir }}"
            owner: "{{ target_user }}"
            group: "{{ target_user }}"
            recurse: true

        - name: Build yay package
          ansible.builtin.command:
            argv:
              - makepkg
              - -f
              - --noconfirm
          args:
            chdir: "{{ yay_build_dir }}"
          become_user: "{{ target_user }}"
          environment:
            HOME: "{{ target_home }}"
            XDG_CONFIG_HOME: "{{ target_home }}/.config"

        - name: Find built yay package artifact
          ansible.builtin.find:
            paths: "{{ yay_build_dir }}"
            patterns: "yay-*.pkg.tar.*"
            file_type: file
          register: yay_pkg_files

        - name: Install built yay package
          ansible.builtin.command:
            argv:
              - pacman
              - -U
              - --noconfirm
              - "{{ (yay_pkg_files.files | rejectattr('path', 'search', '-debug-') | map(attribute='path') | sort | last) }}"

    - name: Refresh yay installation status
      ansible.builtin.stat:
        path: "{{ yay_binary_path }}"
      register: yay_binary

    - name: Configure doas for target user
      ansible.builtin.copy:
        dest: /etc/doas.conf
        content: "{{ doas_conf }}"
        owner: root
        group: root
        mode: "0400"

    - name: Ensure yay config directory exists
      ansible.builtin.file:
        path: "{{ target_home }}/.config/yay"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"

    - name: Check current yay configuration
      ansible.builtin.stat:
        path: "{{ yay_config_file }}"
      register: yay_config_stat

    - name: Read current yay configuration
      ansible.builtin.slurp:
        src: "{{ yay_config_file }}"
      register: yay_config_slurp
      when: yay_config_stat.stat.exists

    - name: Parse current yay configuration
      ansible.builtin.set_fact:
        yay_current_config: >-
          {{
            (yay_config_slurp.content | b64decode | from_json)
            if yay_config_stat.stat.exists else {}
          }}

    - name: Configure yay to use doas
      ansible.builtin.copy:
        dest: "{{ yay_config_file }}"
        content: >-
          {{
            (yay_current_config | default({}))
            | combine(
                {
                  'sudobin': 'doas',
                  'sudoflags': '',
                  'pgpfetch': false
                },
                recursive=True
              )
            | to_nice_json
          }}
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0644"
      when:
        - yay_binary.stat.exists
        - (yay_current_config.sudobin | default('')) != 'doas'
          or (yay_current_config.sudoflags | default('__missing__')) != ''
          or (yay_current_config.pgpfetch | default(true)) != false

    - name: Get all package names available from pacman repos
      ansible.builtin.command:
        argv:
          - pacman
          - -Slq
      register: pacman_repo_names
      changed_when: false

    - name: Split requested package lists into pacman and yay sets
      ansible.builtin.set_fact:
        pacman_repo_packages: "{{ pacman_requested_packages | intersect(pacman_repo_names.stdout_lines | unique) }}"
        pacman_fallback_to_yay: "{{ pacman_requested_packages | difference(pacman_repo_names.stdout_lines | unique) }}"
        combined_yay_packages: "{{ (yay_requested_packages + (pacman_requested_packages | difference(pacman_repo_names.stdout_lines | unique))) | unique }}"

    - name: Install packages available from pacman repositories
      ansible.builtin.package:
        name: "{{ pacman_repo_packages }}"
        state: present
      when: pacman_repo_packages | length > 0

    - name: Get currently installed package names
      ansible.builtin.command:
        argv:
          - pacman
          - -Qq
      register: installed_package_names
      changed_when: false

    - name: Compute missing packages that still need yay
      ansible.builtin.set_fact:
        yay_missing_packages: >-
          {{
            combined_yay_packages
            | reject('match', '.*-debug$')
            | difference(installed_package_names.stdout_lines | default([]))
          }}

    - name: Install packages from yay package set
      ansible.builtin.command:
        argv: "{{ [yay_binary_path, '-S', '--noconfirm', '--needed', '--answerclean', 'All', '--answerdiff', 'None', '--mflags', '--skippgpcheck'] + yay_missing_packages }}"
      become_user: "{{ target_user }}"
      environment:
        HOME: "{{ target_home }}"
        XDG_CONFIG_HOME: "{{ target_home }}/.config"
      when:
        - yay_binary.stat.exists
        - yay_missing_packages | length > 0

    - name: Check if /opt/spotify exists
      ansible.builtin.stat:
        path: /opt/spotify
      register: spotify_dir

    - name: Set permissions on /opt/spotify
      ansible.builtin.file:
        path: /opt/spotify
        mode: a+rw
      when: spotify_dir.stat.exists

    - name: Check if /opt/spotify/Apps exists
      ansible.builtin.stat:
        path: /opt/spotify/Apps
      register: spotify_apps_dir

    - name: Set permissions on /opt/spotify/Apps recursively
      ansible.builtin.file:
        path: /opt/spotify/Apps
        mode: a+rw
        recurse: true
      when: spotify_apps_dir.stat.exists

    - name: Ensure target .config directory exists
      ansible.builtin.file:
        path: "{{ target_home }}/.config"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"

    - name: Deploy .config contents to target user
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/.config/"
        dest: "{{ target_home }}/.config/"
        remote_src: true
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        directory_mode: "0755"

    - name: Check if Oh My Zsh is already installed
      ansible.builtin.stat:
        path: "{{ target_home }}/.oh-my-zsh"
      register: ohmyzsh_dir

    - name: Install Oh My Zsh
      ansible.builtin.shell:
        cmd: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
      environment:
        RUNZSH: "no"
        CHSH: "no"
      become_user: "{{ target_user }}"
      when: not ohmyzsh_dir.stat.exists

    - name: Clone Powerlevel10k theme into Oh My Zsh custom themes
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ target_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
        depth: 1
      become_user: "{{ target_user }}"

    - name: Clone fzf-tab plugin into Oh My Zsh custom plugins
      ansible.builtin.git:
        repo: https://github.com/Aloxaf/fzf-tab.git
        dest: "{{ target_home }}/.oh-my-zsh/custom/plugins/fzf-tab"
      become_user: "{{ target_user }}"

    - name: Deploy zsh configuration files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0644"
      loop:
        - src: "{{ playbook_dir }}/.zshrc"
          dest: "{{ target_home }}/.zshrc"
        - src: "{{ playbook_dir }}/.p10k.zsh"
          dest: "{{ target_home }}/.p10k.zsh"

    - name: Set zsh as default shell for target user
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /bin/zsh

    - name: Enforce ownership on deployed user configuration
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        recurse: "{{ item.recurse | default(false) }}"
      loop:
        - path: "{{ target_home }}/.config"
          recurse: true
        - path: "{{ target_home }}/.zshrc"
        - path: "{{ target_home }}/.p10k.zsh"

    - name: Create standard XDG user directories
      ansible.builtin.file:
        path: "{{ target_home }}/{{ item }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"
      loop:
        - Downloads
        - Pictures
        - Desktop
        - Documents
        - Videos

    - name: Deploy wallpapers to Pictures directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/wallpapers/"
        dest: "{{ target_home }}/Pictures/wallpapers/"
        remote_src: true
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        directory_mode: "0755"

    - name: Ensure SMB support directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: /etc/samba
          owner: root
          group: root
          mode: "0755"
        - path: "{{ smb_mountpoint }}"
          owner: root
          group: root
          mode: "0755"

    - name: Install SMB credentials file
      ansible.builtin.copy:
        dest: "{{ smb_credentials_file }}"
        content: |
          username={{ smb_username }}
          password={{ smb_password }}
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install systemd mount unit for SMB share
      ansible.builtin.copy:
        dest: /etc/systemd/system/share.mount
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=SMB share mounted at {{ smb_mountpoint }}
          After=network-online.target
          Wants=network-online.target

          [Mount]
          What={{ smb_source }}
          Where={{ smb_mountpoint }}
          Type=cifs
          Options=credentials={{ smb_credentials_file }},uid={{ target_uid }},gid={{ target_gid }},file_mode=0644,dir_mode=0755,iocharset=utf8,vers=3.0,_netdev,nofail
      notify: Reload systemd

    - name: Install systemd automount unit for SMB share
      ansible.builtin.copy:
        dest: /etc/systemd/system/share.automount
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Automount SMB share at {{ smb_mountpoint }}
          After=network-online.target
          Wants=network-online.target

          [Automount]
          Where={{ smb_mountpoint }}
          TimeoutIdleSec=0

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    - name: Flush systemd unit reload
      ansible.builtin.meta: flush_handlers

    - name: Enable and start SMB automount
      ansible.builtin.systemd:
        name: share.automount
        enabled: true
        state: started

    - name: Mount SMB share now
      ansible.builtin.systemd:
        name: share.mount
        state: started

    - name: Ensure Brave managed policy directory exists
      ansible.builtin.file:
        path: /etc/brave/policies/managed
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Brave managed extensions policy
      ansible.builtin.copy:
        dest: /etc/brave/policies/managed/extensions.json
        content: "{{ brave_extensions_policy }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install Brave managed search and new tab policy
      ansible.builtin.copy:
        dest: /etc/brave/policies/managed/settings.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "DefaultSearchProviderEnabled": true,
            "DefaultSearchProviderName": "Search",
            "DefaultSearchProviderSearchURL": "https://search.social-network.work/?q={searchTerms}",
            "NewTabPageLocation": "https://home.social-network.work/",
            "BraveThemeType": 1
          }

    - name: Enable and start SDDM
      ansible.builtin.systemd:
        name: sddm
        enabled: true
        state: started

# Run:
# ansible-playbook -i localhost, -c local site.yml --ask-become-pass

# ~/.config/hypr/hyprlock.conf

background {
    monitor =
    path = screenshot
    color = rgba(12, 14, 30, 1.0)

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.95
    brightness = 0.82
    vibrancy = 0.12
    vibrancy_darkness = 0.05

    zindex = -1
}

# Soft glass panel behind the centered content
shape {
    monitor =
    size = 34%, 320
    color = rgba(24, 26, 54, 0.28)
    rounding = 28

    border_size = 1
    border_color = rgba(198, 201, 255, 0.18)

    position = 0, -8
    halign = center
    valign = center
    zindex = 1
}

# Large clock
label {
    monitor =
    text = $TIME12
    color = rgba(232, 234, 255, 1.0)
    font_size = 86
    font_family = Sans

    position = 0, -110
    halign = center
    valign = center
    zindex = 2
}

# Date
label {
    monitor =
    text = cmd[update:1000] date '+%A, %B %d'
    color = rgba(182, 185, 245, 1.0)
    font_size = 22
    font_family = Sans

    position = 0, -48
    halign = center
    valign = center
    zindex = 2
}

# Username
label {
    monitor =
    text = $USER
    color = rgba(198, 201, 255, 0.85)
    font_size = 16
    font_family = Sans

    position = 0, -10
    halign = center
    valign = center
    zindex = 2
}

# Password field
input-field {
    monitor =
    size = 24%, 64
    outline_thickness = 2

    inner_color = rgba(37, 32, 78, 0.40)
    outer_color = rgba(125, 235, 255, 0.22)
    font_color = rgba(232, 234, 255, 0.95)
    font_family = Sans

    fade_on_empty = false
    rounding = 20

    placeholder_text = "<i>enter password</i>"

    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    dots_rounding = -1

    check_color = rgba(125, 235, 255, 0.35)
    fail_color = rgba(255, 183, 200, 0.40)
    fail_text = "<i>$FAIL <b>($ATTEMPTS)</b></i>"

    position = 0, 52
    halign = center
    valign = center
    zindex = 2
}
